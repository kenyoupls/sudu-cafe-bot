name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: No secrets in the repo
        run: python check_secrets.py --all
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Tests
        run: pytest -q
